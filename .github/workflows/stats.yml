name: Daily pageview baseline

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-baseline
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python stats/snapshot.py
      - run: |
          git config user.name "stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats/baseline.json
          if git diff --cached --quiet; then echo "No change."; else
            git commit -m "Update pageview baseline"
            git pull --rebase origin main || true
            git push
          fi
