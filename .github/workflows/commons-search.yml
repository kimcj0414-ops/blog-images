name: Search Wikimedia Commons
on:
  push:
    paths: ["usk/commons/queries.txt"]
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Commons API
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time, re
          out = {}
          for q in open('usk/commons/queries.txt', encoding='utf-8'):
              q = q.strip()
              if not q or q.startswith('#'): continue
              params = {'action': 'query', 'generator': 'search', 'gsrsearch': q, 'gsrnamespace': '6', 'gsrlimit': '20',
                        'prop': 'imageinfo', 'iiprop': 'url|extmetadata|size|mime', 'iiurlwidth': '1600', 'format': 'json'}
              url = 'https://commons.wikimedia.org/w/api.php?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': 'BlogImageSearch/1.0 (github.com/kimcj0414-ops/blog-images)'})
              data = json.load(urllib.request.urlopen(req))
              rows = []
              for p in (data.get('query', {}).get('pages', {}) or {}).values():
                  ii = (p.get('imageinfo') or [{}])[0]
                  m = ii.get('extmetadata', {})
                  g = lambda k: re.sub('<[^>]+>', '', (m.get(k) or {}).get('value', ''))[:200]
                  rows.append({'title': p['title'], 'url': ii.get('url'), 'thumb': ii.get('thumburl'),
                               'w': ii.get('width'), 'h': ii.get('height'), 'mime': ii.get('mime'),
                               'license': g('LicenseShortName'), 'artist': g('Artist'),
                               'desc': g('ImageDescription'), 'page': ii.get('descriptionurl')})
              out[q] = rows
              time.sleep(2)
          json.dump(out, open('usk/commons/results.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add usk/commons/results.json
          git commit -m "Commons search results" || echo nothing
          git push
